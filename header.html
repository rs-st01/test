<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Header</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background: #000;
    font-family: 'Times New Roman', 'Noto Serif JP', serif;
    overflow: hidden;
  }

  nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 40px;
    height: 64px;
    background: #000;
    border-bottom: 1px solid #222;
    position: relative;
    z-index: 100;
  }

  .nav-left {
    display: flex;
    align-items: center;
    gap: 48px;
  }

  .nav-item {
    position: relative;
  }

  .nav-link {
    color: #ccc;
    text-decoration: none;
    font-size: 13px;
    letter-spacing: 0.12em;
    font-weight: 400;
    cursor: pointer;
    transition: color 0.2s;
    white-space: nowrap;
    display: block;
    padding: 20px 0;
  }

  .nav-link:hover,
  .nav-item:hover .nav-link {
    color: #fff;
  }

  /* ホバーで下線アニメーション */
  .nav-link::after {
    content: '';
    position: absolute;
    bottom: 16px;
    left: 0;
    width: 0;
    height: 1px;
    background: #fff;
    transition: width 0.3s ease;
  }

  .nav-link:hover::after,
  .nav-item:hover .nav-link::after {
    width: 100%;
  }

  /* ロゴ（中央） */
  .nav-center {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    font-size: 15px;
    letter-spacing: 0.25em;
    color: #fff;
    font-weight: 400;
    text-decoration: none;
    white-space: nowrap;
  }

  /* 右側：会社概要 */
  .nav-right {
    display: flex;
    align-items: center;
  }

  /* ドロップダウン共通 */
  .dropdown {
    position: absolute;
    top: 64px;
    left: 0;
    background: #000;
    border: 1px solid #222;
    border-top: none;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
    z-index: 200;
  }

  .nav-item:hover .dropdown {
    opacity: 1;
    pointer-events: auto;
  }

  /* Brandドロップダウン：バナー表示 */
  .dropdown-brand {
    width: 280px;
    padding: 24px;
  }

  .brand-banner {
    display: block;
    text-decoration: none;
    position: relative;
    overflow: hidden;
  }

  .brand-banner img {
    width: 100%;
    height: 120px;
    object-fit: cover;
    display: block;
    filter: brightness(0.85);
    transition: filter 0.3s, transform 0.4s;
  }

  .brand-banner:hover img {
    filter: brightness(1);
    transform: scale(1.03);
  }

  .brand-banner-label {
    margin-top: 12px;
    color: #aaa;
    font-size: 11px;
    letter-spacing: 0.2em;
    text-align: center;
    transition: color 0.2s;
  }

  .brand-banner:hover .brand-banner-label {
    color: #fff;
  }

  /* Categoryドロップダウン */
  .dropdown-category {
    width: 220px;
    padding: 8px 0;
  }

  .dropdown-category a {
    display: block;
    padding: 13px 28px;
    color: #aaa;
    text-decoration: none;
    font-size: 13px;
    letter-spacing: 0.1em;
    transition: color 0.2s, background 0.2s;
    border-bottom: 1px solid #111;
  }

  .dropdown-category a:last-child {
    border-bottom: none;
  }

  .dropdown-category a:hover {
    color: #fff;
    background: #0a0a0a;
  }

  .nav-item-brand .dropdown {
    left: 0;
  }
</style>
</head>
<body>

<nav>
  <!-- 左側ナビ -->
  <div class="nav-left">

    <!-- Home -->
    <div class="nav-item">
      <a class="nav-link" href="https://www.rakuten.co.jp/atman/" target="_top">Home</a>
    </div>

    <!-- Brand -->
    <div class="nav-item nav-item-brand">
      <span class="nav-link">Brand</span>
      <div class="dropdown dropdown-brand">
        <a class="brand-banner" href="https://www.rakuten.ne.jp/gold/YOUR_SHOP_ID/brand/chronoclock.html" target="_top">
          <img src="chronoclock_banner.jpg" alt="CHRONO CLOCK">
          <div class="brand-banner-label">CHRONO CLOCK</div>
        </a>
      </div>
    </div>

    <!-- Category -->
    <div class="nav-item">
      <span class="nav-link">Category</span>
      <div class="dropdown dropdown-category">
        <a href="https://www.rakuten.co.jp/atman/c/hairoil/" target="_top">Hair Oil</a>
        <a href="https://www.rakuten.co.jp/atman/c/hairfoam/" target="_top">Hair Foam</a>
        <a href="https://www.rakuten.co.jp/atman/c/hairmist/" target="_top">Hair Mist</a>
        <a href="https://www.rakuten.co.jp/atman/c/ticket/" target="_top">Ticket</a>
        <a href="https://www.rakuten.co.jp/atman/c/" target="_top">ALL Item</a>
      </div>
    </div>

    <!-- 会社概要（規約必須） -->
    <div class="nav-item">
      <a class="nav-link" href="https://www.rakuten.co.jp/atman/info.html" target="_top">会社概要</a>
    </div>

  </div>

  <!-- 中央ロゴ -->
  <a class="nav-center" href="https://www.rakuten.co.jp/atman/" target="_top">Ātman shop</a>

  <!-- 右側（空） -->
  <div class="nav-right"></div>
</nav>

</body>
</html>
